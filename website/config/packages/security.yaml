security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        spipu_users:
            entity:
                class: App\Entity\User
                property: 'username'

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            pattern:      ^/
            provider:     spipu_users
            user_checker: Spipu\UserBundle\Security\UserChecker
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                remember_me: true
                login_path: spipu_user_security_login
                check_path: spipu_user_security_login
                enable_csrf: true
                default_target_path: app_home
            remember_me:
                secret: "%kernel.secret%"
                name: linky_reader_remember
                lifetime: 604800 # 7 days
                httponly: true
                secure: auto
                signature_properties: ['password', 'email']
            logout:
                path: spipu_user_security_logout
                target: app_home

    access_control:
        - { path: ^/login,               roles: PUBLIC_ACCESS }
        - { path: ^/logout,              roles: PUBLIC_ACCESS }
        - { path: ^/,                    roles: PUBLIC_ACCESS }
